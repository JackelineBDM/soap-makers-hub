<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Soap Makers Hub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f4ef; }
        .navbar { background: #5c4033; }
        .navbar-brand, .nav-link { color: #f8f4ef !important; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        footer { background: #5c4033; color: #f8f4ef; }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar navbar-dark" style="background: #6b4f3a;">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Soap Makers Hub</a>
            <div>
                <a class="btn btn-sm btn-outline-light me-2" href="{% url 'home' %}">
                    <i class="bi bi-house"></i> Home
                </a>
                <a class="btn btn-sm btn-outline-light me-2" href="{% url 'product-list' %}">
                    <i class="bi bi-shop"></i> Shop
                </a>
                <a class="btn btn-sm btn-outline-light position-relative" href="{% url 'cart' %}">
                    <i class="bi bi-cart"></i> Cart
                    {% if cart_count %}
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">
                            {{ cart_count }}
                        </span>
                    {% endif %}
                </a>
            </div>
        </div>
    </nav>
    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>
    <footer class="py-3 text-center">
        <small>Handmade soaps</small>
    </footer>
</body>
</html>
