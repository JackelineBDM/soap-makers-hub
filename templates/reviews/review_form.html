{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
<p>Soap: <strong>{{ product.name }}</strong></p>
<form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}
        <div class="text-danger" role="alert">{{ error }}</div>
        {% endfor %}
    </div>
    {% endfor %}
    <button class="btn btn-warning" type="submit">Save review</button>
    <a class="btn btn-outline-dark" href="{% url 'product-detail' product.pk %}">Cancel</a>
</form>
{% endblock %}
