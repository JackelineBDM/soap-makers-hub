{% extends "base.html" %}
{% block title %}Delete review{% endblock %}
{% block content %}
<h1>Delete your review?</h1>
<p>You are about to delete your review of <strong>{{ review.product.name }}</strong>. This cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, delete it</button>
    <a class="btn btn-outline-dark" href="{% url 'product-detail' review.product.pk %}">No, keep it</a>
</form>
{% endblock %}
