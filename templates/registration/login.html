{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if form.errors %}
<div class="alert alert-danger" role="alert">
    Sorry, that username and password did not match. Please try again.
</div>
{% endif %}
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-warning" type="submit">Log in</button>
</form>
<p class="mt-3">New here? <a href="{% url 'register' %}">Create an account</a></p>
{% endblock %}
